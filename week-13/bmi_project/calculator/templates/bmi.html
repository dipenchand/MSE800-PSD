<!doctype html>
<html>
  <head>
    <title>BMI Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="card mx-auto mt-5 p-5 w-100">
        <h2 class="text-center">BMI Calculator</h2>

        <form method="post" class="form" id="bmi-form">
          {% csrf_token %}
            <div class="d-flex gap-2 mb-3">
              <div class="form-group">
                <label>Weight (kg):</label>
                <input class="form-control" type="number" step="0.1" name="weight" required />
              </div>
              <div class="form-group">
                <label>Height (cm):</label>
                <input class="form-control" type="number" step="0.1" name="height" required />
              </div>
              <div class="form-group">
                <label>Age</label>
                <input class="form-control" type="number" name="age" required />
              </div>
              <div class="form-group">
                <label>Gender</label>
                <select class="form-control" name="gender" required>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                </select>
              </div>
              <div class="d-flex align-items-end">
                <button type="submit" class="btn btn-primary" id="submit-btn">Calculate</button>
              </div>
            </div>
        </form>

        <div id="loading" class="mt-3" style="display: none;">
          <div class="d-flex align-items-center gap-2">
            <div class="spinner-border" role="status" aria-hidden="true"></div>
            <strong>Generating your plan... please wait.</strong>
          </div>
        </div>

        {% if bmi %}
        <h3>Your BMI: {{ bmi|floatformat:2 }}</h3>
        {% if category %}
        <p>Category: <strong>{{ category }}</strong></p>
        {% endif %} {% endif %}
        
        {% if plan %}
        <div class="border-top pt-3">
          <h3>Recommended Plan</h3>
          {{ plan|safe }}
        </div>
        {% endif %}
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      (function () {
        const form = document.getElementById("bmi-form");
        const loading = document.getElementById("loading");
        const submitBtn = document.getElementById("submit-btn");

        if (!form || !loading || !submitBtn) return;

        form.addEventListener("submit", function () {
          loading.style.display = "block";
          submitBtn.disabled = true;
          submitBtn.textContent = "Generating...";
        });
      })();
    </script>
  </body>
</html>
